<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Rendering Algo</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #050510;
      color: white;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="info">
    <b>Pixel grid test</b><br>
  </div>

<script>

  //we add shapes (like lines) to this canvas
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");


  const rows = 200;
  const cols = 320;
  const pixelGrid = Array.from({ length: cols }, () => Array(rows).fill("#050510"));

  let seePixelOutline = true; 

  // makePixelatedLine(50, 90, 100, 50, "#00FF00" ); 
  // makePixelatedLine(50, 60, 100, 50, "#00FF00" ); 

  makePixelatedLine(50, 150, 75, 50, "#00FF00"); 



  function draw(){

    //here we set up and clear the canvas, every draw frame
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.lineWidth = 1;
    ctx.strokeStyle = "#444444";


    for(v=0; v< 200; v++){
      for(u=0; u<320; u++){

        //if you want to see what is going on
        // console.log(u);
        // console.log(v);
        // console.log(pixelGrid[u][v]);
        // console.log("----")

        ctx.fillStyle = pixelGrid[u][v];
        ctx.fillRect(u*5, v*5, 5, 5);

        if( seePixelOutline ){
          ctx.strokeRect(u*5, v*5, 5, 5);
        }

      }
    }


  }

  function setPixelColor(u,v,color){
    pixelGrid[u][v] = color; 
  }

  function makePixelatedLine(u1, v1, u2, v2, color) {
    let x1 = u1, y1 = v1;
    let x2 = u2, y2 = v2;

    const steep = Math.abs(y2 - y1) > Math.abs(x2 - x1);
    if (steep) {
        [x1, y1] = [y1, x1];
        [x2, y2] = [y2, x2];
    }

    if (x1 > x2) {
        [x1, x2] = [x2, x1];
        [y1, y2] = [y2, y1];
    }

    const m = (x2 === x1) ? 0 : (y2 - y1) / (x2 - x1);
    const b = y1 - m * x1;

    for (let x = x1; x <= x2; x++) {
        const y = Math.round(m * x + b);
        if (steep) setPixelColor(y, x, color);  
        else       setPixelColor(x, y, color);
    }
  }

  function betweenInts(x, x1, x2) {
    return (x > x1 && x < x2)
  }

  
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
  }



  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();



</script>
</body>
</html>
