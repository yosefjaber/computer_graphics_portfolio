<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Rendering Algo</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #050510;
      color: white;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="info">
    <b>Projection</b><br>
  </div>

<script>
  //
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const rows = 200;
  const cols = 320;
  const pixelGrid = Array.from({ length: cols }, () => Array(rows).fill("#050510"));

  let seePixelOutline = false; 

  const limit = 1
  const spaceBetweenOtherCars = 25
  const otherCarsOffset = 40
  const otherCarsCount = 100

  let camera = {x: 0, y: 5, z: -10}

  //Objects
  const car = {
    "vertices": [
        {"x": 0, "y": 0, "z": 0},
        {"x": 1, "y": 0, "z": 5},
        {"x": 0, "y": 0, "z": 5},
        {"x": 1, "y": 0, "z": 0},

        {"x": 0, "y": 1, "z": 0},
        {"x": 1, "y": 1, "z": 5},
        {"x": 0, "y": 1, "z": 5},
        {"x": 1, "y": 1, "z": 0},
    ],
    "edges": [
        [0,2],
        [0,3],
        [1,3],
        [1,2],

        [4,7],
        [4,6],
        [5,6],
        [5,7],

        [0,4],
        [1,5],
        [2,6],
        [3,7],
    ],
    "color": "blue",
    "scale": 1
  }

  const plane = {
    "vertices": [
        {"x": -500, "y": 0, "z": 0},
        {"x": -500, "y": 0, "z": 2000},
        {"x": 500, "y": 0, "z": 0},
        {"x": 500, "y": 0, "z": 2000},

        {"x": 3, "y": 0, "z": 0},
        {"x": -3, "y": 0, "z": 0},

        {"x": 3, "y": 0, "z": 2000},
        {"x": -3, "y": 0, "z": 2000},
    ],
    "edges": [
        [0,1],
        [0,2],
        [1,3],
        [2,3],

        [4,6], 
        [5,7],
    ],
    "color": "white",
    "scale": 1
  }

  const laneLine = {
    "vertices": [
        {"x": 0, "y": 0, "z": 0},
        {"x": 0, "y": 0, "z": 1},
    ],
    "edges": [
        [0,1],
    ],
    "color": "white",
    "scale": 1
  }

  const lamp = {
    "vertices": [
        {"x": 0, "y": 0, "z": 0},
        {"x": 1, "y": 0, "z": 0},
        {"x": 1, "y": 0, "z": 2},
        {"x": 0, "y": 0, "z": 2},

        {"x": 0, "y": 4, "z": 0},
        {"x": 1, "y": 4, "z": 0},
        {"x": 1, "y": 4, "z": 2},
        {"x": 0, "y": 4, "z": 2},
    ],
    "edges": [
        [0,1],
        [0,3],
        [1,2],
        [2,3],

        [4,5],
        [4,7],
        [5,6],
        [6,7],

        [0,4],
        [1,5],
        [2,6],
        [3,7],
    ],
    "color": "white",
    "scale": 1
  }

  let scene = {
    objs: [plane, car],
    offset: [{x:0,y:0,z:0}, {x:-.5,y:0,z:.5}]
  }

  let other_cars = []
  let other_cars_offset = []
  let other_cars_front_right_vertex = []

  createLaneLines()
  createLamps()
  spawnOtherCars()

  scene.objs.push(...other_cars)
  scene.offset.push(...other_cars_offset)

  //ALL FUNCTIONS BELOW

  function setPixelColor(u,v,color){
    if (u < 0 || u >= cols || v < 0 || v >= rows) return;
    pixelGrid[u][v] = color
  }

  function betweenInts(x, lower, upper){
    return (x > lower && x < upper)
  }

  function setPixelColor(u,v,color){
    if (u < 0 || u >= cols || v < 0 || v >= rows) return;
    pixelGrid[u][v] = color
  }

  function loop() {
    drive();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function drive() {
    for (let u = 0; u < cols; u++) pixelGrid[u].fill("#050510");

    camera.z+=0.3;
    for(v of car.vertices) {
      v.z += 0.3  
    }

    makeLines()
    draw() 
    checkForCollision()
  }

  function draw(){

    //here we set up and clear the canvas, every draw frame
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.lineWidth = 1;
    ctx.strokeStyle = "#444444";

    for(let v=0; v< 200; v++){
      for(let u=0; u<320; u++){
        ctx.fillStyle = pixelGrid[u][v];
        ctx.fillRect(u*5, v*5, 5, 5);

        if( seePixelOutline ){
          ctx.strokeRect(u*5, v*5, 5, 5);
        }

      }
    }
  }

  function makeLines() {
    let offsetIndex = 0
    for (let obj of scene.objs){
      let offset = scene.offset[offsetIndex]
      for(let e = 0; e < obj.edges.length; e++) {
        let v1 = {x: obj.vertices[obj.edges[e][0]].x + offset.x, y: obj.vertices[obj.edges[e][0]].y + offset.y, z: obj.vertices[obj.edges[e][0]].z + offset.z}
        let v2 = {x: obj.vertices[obj.edges[e][1]].x + offset.x, y: obj.vertices[obj.edges[e][1]].y + offset.y, z: obj.vertices[obj.edges[e][1]].z + offset.z}

        let cam1 = { x: v1.x - camera.x, y: v1.y - camera.y, z: v1.z - camera.z }
        let cam2 = { x: v2.x - camera.x, y: v2.y - camera.y, z: v2.z - camera.z }

        let vert1_in_front = cam1.z > limit
        let vert2_in_front = cam2.z > limit

        // Both vertices are behind --> dont render it
        if(!vert1_in_front && !vert2_in_front) continue;

        // If one is in front and the other behind we need to move the one behind in front of the camera in a way that doesn't look goofy
        if(vert1_in_front && !vert2_in_front) {
          cam2 = planeIntersect(cam1, cam2)
        }
        if(!vert1_in_front && vert2_in_front) {
          cam1 = planeIntersect(cam2, cam1)
        }

        let p1 = {}
        p1.u = (cam1.x/cam1.z) * cols + cols / 2
        p1.v = (cam1.y/cam1.z) * rows + rows / 2

        let p2 = {}
        p2.u = (cam2.x/cam2.z) * cols + cols / 2
        p2.v = (cam2.y/cam2.z) * rows + rows / 2

        drawLine(Math.round(p1.u), Math.round(rows - p1.v), Math.round(p2.u), Math.round(rows - p2.v), obj.color)
      }
      offsetIndex+=1
    }
  }

  function planeIntersect(front, back) {
      let new_back_vert = {}
      // t is a fraction of how much of the line is visable
      let t = (front.z - limit) / (front.z - back.z)

      new_back_vert.x = front.x + t * (back.x - front.x)
      new_back_vert.y = front.y + t * (back.y - front.y)
      new_back_vert.z = limit
      return new_back_vert;
  }
                                                                                                                                       
  function drawLine(u1, v1, u2, v2, color) {
    let x1 = u1, y1 = v1;
    let x2 = u2, y2 = v2;

    const steep = Math.abs(y2 - y1) > Math.abs(x2 - x1);
    if (steep) {
        [x1, y1] = [y1, x1];
        [x2, y2] = [y2, x2];
    }

    if (x1 > x2) {
        [x1, x2] = [x2, x1];
        [y1, y2] = [y2, y1];
    }

    const m = (x2 === x1) ? 0 : (y2 - y1) / (x2 - x1);
    const b = y1 - m * x1;

    for (let x = x1; x <= x2; x++) {
        const y = Math.round(m * x + b);
        if (steep) setPixelColor(y, x, color);  
        else       setPixelColor(x, y, color);
    }
  }

  function checkForCollision() {
    car_front_right_vertex = car.vertices[1]

    for(let other_car_front_right_vertex of other_cars_front_right_vertex) {
      let x_collision = betweenInts(car_front_right_vertex.x, other_car_front_right_vertex.x - 1 , other_car_front_right_vertex.x + 1)
      let z_collision = betweenInts(car_front_right_vertex.z, other_car_front_right_vertex.z - 5, other_car_front_right_vertex.z + 5)
      if (x_collision && z_collision) {
        crash()
      }
    }
  }

  function crash() {
    console.log("CRASH")
    reset()
  }

  function reset() {
    camera = {x: 0, y: 5, z: -10};
    car.vertices = [
        {"x": 0, "y": 0, "z": 0},
        {"x": 1, "y": 0, "z": 5},
        {"x": 0, "y": 0, "z": 5},
        {"x": 1, "y": 0, "z": 0},

        {"x": 0, "y": 1, "z": 0},
        {"x": 1, "y": 1, "z": 5},
        {"x": 0, "y": 1, "z": 5},
        {"x": 1, "y": 1, "z": 0},
    ]
  }

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
  }

  function spawnOtherCars() {
    for(let i = 0; i < otherCarsCount; i++) {

      let car_clone = structuredClone(car)
      car_clone.color = "red"
      other_cars.push(car_clone)

      let randXPos = Math.floor(Math.random() * 3)

      other_cars_offset.push({x:-2.5 + (2 * randXPos),y:0,z:otherCarsOffset+(i*spaceBetweenOtherCars)})
      other_cars_front_right_vertex.push({x:-2.5 + (2 * randXPos) + 1.5,y:0,z:otherCarsOffset+(i*spaceBetweenOtherCars)+5})
    }
  }

  function createLaneLines() {
    for(let i = 0; i < 400; i++) {
      scene.objs.push(laneLine)
      scene.offset.push({x: 1, y: 0, z: i*3})
      scene.objs.push(laneLine)
      scene.offset.push({x: -1, y: 0, z: i*3})
    }
  }
  
  function createLamps() {
    for(let i = 0; i < 10; i++) {
      x_1 = Math.random()
      x_2 = Math.random()
      scene.objs.push(lamp)
      scene.offset.push({x: 4 + x_1, y: 0, z: i*100})
      scene.objs.push(lamp)
      scene.offset.push({x: -5 + x_2, y: 0, z: i*100})
    }
  }

  //this is how we detect events- 

  // do nothing for now....
    document.addEventListener("keydown", (event) => {

      event.preventDefault();
       switch (event.code) {
        case "ArrowLeft":
          if(car_front_right_vertex.x >= -1.5) {
            camera.x-=0.1
            for(v of car.vertices) {
              v.x -= 0.1
            }
          }

          console.log("Left arrow pressed");
          break;
        case "ArrowRight":
          if(car_front_right_vertex.x <= 3.5) {
            camera.x+=0.1
            for(v of car.vertices) {
              v.x += 0.1
            }
          }

          console.log("Right arrow pressed");
          break;
        case "KeyR":
          reset()
          break;
        default:
          return; 
      
      }
    });

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();



</script>
</body>
</html>
