<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Rendering Algo</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #050510;
      color: white;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="info">
    <b>Projection</b><br>
  </div>

<script>


// CANVAS SECTION
// This section is to set up the canvas and constant values
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const limit = 1
  const spaceBetweenOtherCars = 30
  const otherCarsOffset = 30
  const otherCarsCount = 66


// OBJECTS SECTION
// This section is for defining objects that will be used later

  const car = {
    "vertices": [
        {"x": 0, "y": 0, "z": 0},
        {"x": 1, "y": 0, "z": 5},
        {"x": 0, "y": 0, "z": 5},
        {"x": 1, "y": 0, "z": 0},

        {"x": 0, "y": 1, "z": 0},
        {"x": 1, "y": 1, "z": 5},
        {"x": 0, "y": 1, "z": 5},
        {"x": 1, "y": 1, "z": 0},
    ],
    "edges": [
        [0,2],
        [0,3],
        [1,3],
        [1,2],

        [4,7],
        [4,6],
        [5,6],
        [5,7],

        [0,4],
        [1,5],
        [2,6],
        [3,7],
    ],
    "color": "blue",
    "scale": {x: 1, y: 1, z: 1}
  }

  const plane = {
    "vertices": [
        {"x": -500, "y": 0, "z": 0},
        {"x": -500, "y": 0, "z": 2000},
        {"x": 500, "y": 0, "z": 0},
        {"x": 500, "y": 0, "z": 2000},

        {"x": 3, "y": 0, "z": 0},
        {"x": -3, "y": 0, "z": 0},

        {"x": 3, "y": 0, "z": 2000},
        {"x": -3, "y": 0, "z": 2000},
    ],
    "edges": [
        [0,1],
        [0,2],
        [1,3],
        [2,3],

        [4,6], 
        [5,7],
    ],
    "color": "white",
    "scale": {x: 1, y: 1, z: 1}
  }

  const laneLine = {
    "vertices": [
        {"x": 0, "y": 0, "z": 0},
        {"x": 0, "y": 0, "z": 1},
    ],
    "edges": [
        [0,1],
    ],
    "color": "white",
    "scale": {x: 1, y: 1, z: 1}
  }

  const lamp = {
    "vertices": [
        {"x": 0, "y": 0, "z": 0},
        {"x": 1, "y": 0, "z": 0},
        {"x": 1, "y": 0, "z": 2},
        {"x": 0, "y": 0, "z": 2},

        {"x": 0, "y": 4, "z": 0},
        {"x": 1, "y": 4, "z": 0},
        {"x": 1, "y": 4, "z": 2},
        {"x": 0, "y": 4, "z": 2},
    ],
    "edges": [
        [0,1],
        [0,3],
        [1,2],
        [2,3],

        [4,5],
        [4,7],
        [5,6],
        [6,7],

        [0,4],
        [1,5],
        [2,6],
        [3,7],
    ],
    "color": "white",
    "scale": {x: 1, y: 1, z: 1}
  }


// SPAWNING OBJECTS SECTION
// This section is for creating the scene data structure
// it also populates all the objects and places them in the world

  // This will hold all the objects and offsets to know where to place them in the world
  // will be used to figure out where all the lines are
  let scene = {
    objs: [plane, car],
    offset: [{x:0,y:0,z:0}, {x:-.5,y:0,z:.5}]
  }

  let camera = {x: 0, y: 5, z: -10};
  let car_front_right_vertex

  let other_cars = []
  let other_cars_offset = []
  let other_cars_front_right_vertex = []

  createLaneLines()
  createLamps()
  spawnOtherCars()


// ANIMATE SECTION
// This section holds the drive and draw functions
// as well as animating

  function drive() {
    camera.z+=.3;
    for(let v of car.vertices) {
      v.z += .3  
    }
    car_front_right_vertex = car.vertices[1]

    draw()  
    checkForCollision()
  }

  function draw(){

    //here we set up and clear the canvas, every draw frame
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, canvas.width, canvas.height);


    let offsetIndex = 0
    for (let obj of scene.objs){
      let offset = scene.offset[offsetIndex]
      for(let e = 0; e < obj.edges.length; e++) {
        let v1 = {x: (obj.vertices[obj.edges[e][0]].x * obj.scale.x) + offset.x, y: (obj.vertices[obj.edges[e][0]].y * obj.scale.y) + offset.y, z: (obj.vertices[obj.edges[e][0]].z * obj.scale.z) + offset.z}
        let v2 = {x: (obj.vertices[obj.edges[e][1]].x * obj.scale.x) + offset.x, y: (obj.vertices[obj.edges[e][1]].y * obj.scale.y) + offset.y, z: (obj.vertices[obj.edges[e][1]].z * obj.scale.z) + offset.z}

        let cam1 = { x: v1.x - camera.x, y: v1.y - camera.y, z: v1.z - camera.z }
        let cam2 = { x: v2.x - camera.x, y: v2.y - camera.y, z: v2.z - camera.z }

        let vert1_in_front = cam1.z > limit
        let vert2_in_front = cam2.z > limit

        if(!vert1_in_front && !vert2_in_front) continue;

        // If one is in front and the other behind we need to move the one behind in front of the camera in a way that doesn't look goofy
        if(vert1_in_front && !vert2_in_front) {
          cam2 = planeIntersect(cam1, cam2)
        }
        if(!vert1_in_front && vert2_in_front) {
          cam1 = planeIntersect(cam2, cam1)
        }

        let p1 = {}
        p1.u = (cam1.x/cam1.z) * canvas.width + canvas.width / 2
        p1.v = (cam1.y/cam1.z) * canvas.height + canvas.height / 2

        let p2 = {}
        p2.u = (cam2.x/cam2.z) * canvas.width + canvas.width / 2
        p2.v = (cam2.y/cam2.z) * canvas.height + canvas.height / 2

        drawLine(p1.u, canvas.height - p1.v, p2.u, canvas.height - p2.v, obj.color)
      }
      offsetIndex+=1
    }
  }

  setInterval(drive, 1000 / 60)


// INPUT SECTION
// This section is for handling the input and moving the car left and right

  document.addEventListener("keydown", (event) => {

    event.preventDefault();
      switch (event.code) {
      case "ArrowLeft":
        if(car_front_right_vertex.x >= -1.5) {
          camera.x-=0.1
          for(let v of car.vertices) {
            v.x -= 0.1
          }
        }
        break;
      case "ArrowRight":
        if(car_front_right_vertex.x <= 3.5) {
          camera.x+=0.1
          for(let v of car.vertices) {
            v.x += 0.1
          }
        }
        break;
      case "KeyR":
        reset()
        break;
    }
  });

// HELPER FUNCTIONS
// These are function that with the main functions


  function betweenInts(x, lower, upper){
    return (x > lower && x < upper);
  }

  // Finds the mid point of two points, one that is infront and one that is behind
  // will place the new point at z = near plane limit
  function planeIntersect(front, back) {
      let new_back_vert = {}
      // t is a fraction of how much of the line is visable
      let t = (front.z - limit) / (front.z - back.z)

      new_back_vert.x = front.x + t * (back.x - front.x)
      new_back_vert.y = front.y + t * (back.y - front.y)
      new_back_vert.z = limit
      return new_back_vert;
  }


  //This uses a built in 'drawLine' function, provided by the javascript canvas                                                                                                                                          
  function drawLine(x1, y1, x2, y2, color) {
    ctx.lineWidth = 2;
    ctx.strokeStyle = color;

    //this is how you draw a line on the canvas 
    ctx.beginPath()
    ctx.moveTo(x1, y1)
    ctx.lineTo(x2, y2)
    ctx.stroke()
  }

  function checkForCollision() {
    for(let other_car_front_right_vertex of other_cars_front_right_vertex) {
      let x_collision = betweenInts(car_front_right_vertex.x, other_car_front_right_vertex.x - 1 , other_car_front_right_vertex.x + 1)
      let z_collision = betweenInts(car_front_right_vertex.z, other_car_front_right_vertex.z - 5, other_car_front_right_vertex.z + 5)
      if (x_collision && z_collision) {
        reset()
      }
    }
  }

  function reset() {
    camera = {x: 0, y: 5, z: -10};
    car.vertices = [
        {"x": 0, "y": 0, "z": 0},
        {"x": 1, "y": 0, "z": 5},
        {"x": 0, "y": 0, "z": 5},
        {"x": 1, "y": 0, "z": 0},

        {"x": 0, "y": 1, "z": 0},
        {"x": 1, "y": 1, "z": 5},
        {"x": 0, "y": 1, "z": 5},
        {"x": 1, "y": 1, "z": 0},
    ]
  }

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
  }

  function spawnOtherCars() {
    for(let i = 0; i < otherCarsCount; i++) {

      let car_clone = structuredClone(car)
      car_clone.color = "red"
      other_cars.push(car_clone)

      let randXPos = Math.floor(Math.random() * 3)

      other_cars_offset.push({x:-2.5 + (2 * randXPos),y:0,z:otherCarsOffset+(i*spaceBetweenOtherCars)})
      other_cars_front_right_vertex.push({x:-2.5 + (2 * randXPos) + 1.5,y:0,z:otherCarsOffset+(i*spaceBetweenOtherCars)+5})
    }
    scene.objs.push(...other_cars)
    scene.offset.push(...other_cars_offset)
  }

  function createLaneLines() {
    for(let i = 0; i < 667; i++) {
      scene.objs.push(laneLine)
      scene.offset.push({x: 1, y: 0, z: i*3})
      scene.objs.push(laneLine)
      scene.offset.push({x: -1, y: 0, z: i*3})
    }
  }
  
  function createLamps() {
    for(let i = 0; i < 20; i++) {
      let x_1 = Math.random()
      let x_2 = Math.random()
      scene.objs.push(lamp)
      scene.offset.push({x: 4 + x_1, y: 0, z: i*100})
      scene.objs.push(lamp)
      scene.offset.push({x: -5 + x_2, y: 0, z: i*100})
    }
  }


  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();



</script>
</body>
</html>
