<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Rendering Algo</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #050510;
      color: white;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="info">
    <b>Projection</b><br>
  </div>

<script>

  //we add shapes (like lines) to this canvas
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const limit = 1

  //an array of objects
  //    to access the first 'x' coordinate you could type vertices[0].x
  let vertices = [  
  ];

  // an array of the indics for the two vertices in each edge
  let edges = [
  ];


  let camera = {x: 0, y: 5, z: -10};

  let plane = {
    "vertices": [
        {"x": -50, "y": 0, "z": 0},
        {"x": -50, "y": 0, "z": 100},
        {"x": 50, "y": 0, "z": 0},
        {"x": 50, "y": 0, "z": 100},

        {"x": 1, "y": 0, "z": 0},
        {"x": 3, "y": 0, "z": 0},
        {"x": -1, "y": 0, "z": 0},
        {"x": -3, "y": 0, "z": 0},

        {"x": 1, "y": 0, "z": 100},
        {"x": 3, "y": 0, "z": 100},
        {"x": -1, "y": 0, "z": 100},
        {"x": -3, "y": 0, "z": 100},
    ],
    "edges": [
        [0,1],
        [0,2],
        [1,3],
        [2,3],

        [2,3],
        [2,3],
        [2,3],
        [2,3],

        [7,11],
        [6, 10],
        [4,8],
        [5,9],
    ]
  }

  let vertexOffset = vertices.length;

  for (const v of plane.vertices) {
      vertices.push(v);
  }

  for (const e of plane.edges) {
      edges.push([e[0] + vertexOffset, e[1] + vertexOffset]);
  }

  function draw(){

    //here we set up and clear the canvas, every draw frame
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    //loop through the edges
    //  find the newly computed projected vertices - 2 per edge
    //  draw the line
    for(let e = 0; e < edges.length; e++){

      let v1 = vertices[edges[e][0]]
      let v2 = vertices[edges[e][1]]

      // Instantly convert to cam relative and do all math from there
      let cam1 = { x: v1.x - camera.x, y: v1.y - camera.y, z: v1.z - camera.z }
      let cam2 = { x: v2.x - camera.x, y: v2.y - camera.y, z: v2.z - camera.z }

      let vert1_in_front = cam1.z > limit
      let vert2_in_front = cam2.z > limit

      // Both vertices are behind --> dont render it
      if(!vert1_in_front && !vert2_in_front) continue;

      // If one is in front and the other behind we need to move the one behind in front of the camera in a way that doesn't look goofy
      if(vert1_in_front && !vert2_in_front) {
        cam2 = planeIntersect(cam1, cam2)
      }
      if(!vert1_in_front && vert2_in_front) {
        cam1 = planeIntersect(cam2, cam1)
      }

      let p1 = {}
      p1.u = (cam1.x/cam1.z) * canvas.width + canvas.width / 2
      p1.v = (cam1.y/cam1.z) * canvas.height + canvas.height / 2

      let p2 = {}
      p2.u = (cam2.x/cam2.z) * canvas.width + canvas.width / 2
      p2.v = (cam2.y/cam2.z) * canvas.height + canvas.height / 2

      drawLine(p1.u, canvas.height - p1.v, p2.u, canvas.height - p2.v)
    }
  }

  function planeIntersect(front, back) {
      let new_back_vert = {}
      // t is a fraction of how much of the line is visable
      let t = (front.z - limit) / (front.z - back.z)

      new_back_vert.x = front.x + t * (back.x - front.x)
      new_back_vert.y = front.y + t * (back.y - front.y)
      new_back_vert.z = limit
      return new_back_vert;
  }


  //This uses a built in 'drawLine' function, provided by the javascript canvas
  function drawLine(x1, y1, x2, y2){
    ctx.lineWidth = 2;
    ctx.strokeStyle = "white";

    //this is how you draw a line on the canvas 
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }


  //this is how we detect events- 

  // do nothing for now....
    document.addEventListener("keydown", (event) => {

      event.preventDefault();
       switch (event.code) {
        case "ArrowUp":
          //****TO DO: Change camera z position a go closer
          camera.z+=0.1;
          console.log("Up arrow pressed");
          draw();
          break;
        case "ArrowDown":
          //****TO DO: Change camera z position go further away
          camera.z-=0.1;
          console.log("Down arrow pressed");
          draw();
          break;
        case "ArrowLeft":
          //****TO DO: Change camera x position move left
          camera.x-=0.1;
          console.log("Left arrow pressed");
          draw();
          break;
        case "ArrowRight":
          //****TO DO: Change camera x position move right
          camera.x+=0.1;
          console.log("Right arrow pressed");
          draw();
          break;
        case "KeyR":
          //****TO DO: reset camera
          camera = {x: 0, y: 0, z: -10};
          console.log("Reset");
          draw();
          break;
        default:
          return; 
      
      }
    });

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
  }


  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();



</script>
</body>
</html>
