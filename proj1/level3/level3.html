<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Rendering Algo</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #050510;
      color: white;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="info">
    <b>Projection</b><br>
  </div>

<script>
  //
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const rows = 200;
  const cols = 320;
  const pixelGrid = Array.from({ length: cols }, () => Array(rows).fill("#050510"));

  let seePixelOutline = false; 

  const limit = 1
  const spaceBetweenOtherCars = 25
  const otherCarsOffset = 40
  const otherCarsCount = 100

  let camera = {x: 0, y: 5, z: -10}

  //Objects

  //I lowkey used AI for these objects..plz dont be mad...
  const car = {
    "triangles": [
      // x = 0 face (left)
      [{"x": 0, "y": 0, "z": 0}, {"x": 0, "y": 0, "z": 5}, {"x": 0, "y": 1, "z": 5}],
      [{"x": 0, "y": 0, "z": 0}, {"x": 0, "y": 1, "z": 5}, {"x": 0, "y": 1, "z": 0}],

      // x = 1 face (right)
      [{"x": 1, "y": 0, "z": 0}, {"x": 1, "y": 1, "z": 0}, {"x": 1, "y": 1, "z": 5}],
      [{"x": 1, "y": 0, "z": 0}, {"x": 1, "y": 1, "z": 5}, {"x": 1, "y": 0, "z": 5}],

      // y = 1 face (top)
      [{"x": 0, "y": 1, "z": 0}, {"x": 0, "y": 1, "z": 5}, {"x": 1, "y": 1, "z": 0}],
      [{"x": 0, "y": 1, "z": 5}, {"x": 1, "y": 1, "z": 5}, {"x": 1, "y": 1, "z": 0}],

      // y = 0 face (bottom)
      [{"x": 0, "y": 0, "z": 0}, {"x": 1, "y": 0, "z": 0}, {"x": 1, "y": 0, "z": 5}],
      [{"x": 0, "y": 0, "z": 0}, {"x": 1, "y": 0, "z": 5}, {"x": 0, "y": 0, "z": 5}],

      // z = 0 face (back)
      [{"x": 0, "y": 0, "z": 0}, {"x": 0, "y": 1, "z": 0}, {"x": 1, "y": 1, "z": 0}],
      [{"x": 0, "y": 0, "z": 0}, {"x": 1, "y": 1, "z": 0}, {"x": 1, "y": 0, "z": 0}],

      // z = 5 face (front)
      [{"x": 0, "y": 0, "z": 5}, {"x": 1, "y": 0, "z": 5}, {"x": 1, "y": 1, "z": 5}],
      [{"x": 0, "y": 0, "z": 5}, {"x": 1, "y": 1, "z": 5}, {"x": 0, "y": 1, "z": 5}]
    ],
    "color": "blue",
    "scale": 1
  }

  const plane = {
    "triangles": [
      [{"x": -500, "y": 0, "z": 0},    {"x": -500, "y": 0, "z": 2000}, {"x": 500, "y": 0, "z": 0}],
      [{"x": -500, "y": 0, "z": 2000}, {"x": 500, "y": 0, "z": 2000},  {"x": 500, "y": 0, "z": 0}]
    ],
    "color": "white",
    "scale": 1
  }

  const laneLine = {
    "vertices": [
        {"x": 0, "y": 0, "z": 0},
        {"x": 0, "y": 0, "z": 1},
    ],
    "edges": [
        [0,1],
    ],
    "color": "white",
    "scale": 1
  }

  const lamp = {
    "vertices": [
        {"x": 0, "y": 0, "z": 0},
        {"x": 1, "y": 0, "z": 0},
        {"x": 1, "y": 0, "z": 2},
        {"x": 0, "y": 0, "z": 2},

        {"x": 0, "y": 4, "z": 0},
        {"x": 1, "y": 4, "z": 0},
        {"x": 1, "y": 4, "z": 2},
        {"x": 0, "y": 4, "z": 2},
    ],
    "edges": [
        [0,1],
        [0,3],
        [1,2],
        [2,3],

        [4,5],
        [4,7],
        [5,6],
        [6,7],

        [0,4],
        [1,5],
        [2,6],
        [3,7],
    ],
    "color": "white",
    "scale": 1
  }

  let scene = {
    objs: [plane, car],
    offset: [{x:0,y:0,z:0}, {x:-.5,y:0,z:.5}]
  }

  let other_cars = []
  let other_cars_offset = []
  let other_cars_front_right_vertex = []

  // createLaneLines()
  // createLamps()
  // spawnOtherCars()

  // scene.objs.push(...other_cars)
  // scene.offset.push(...other_cars_offset)

  //ALL FUNCTIONS BELOW

  function setPixelColor(u,v,color){
    if (u < 0 || u >= cols || v < 0 || v >= rows) return;
    pixelGrid[u][v] = color
  }

  function betweenInts(x, lower, upper){
    return (x > lower && x < upper)
  }

  function setPixelColor(u,v,color){
    if (u < 0 || u >= cols || v < 0 || v >= rows) return;
    pixelGrid[u][v] = color
  }

  function loop() {
    drive();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function draw() {
    const cw = canvas.width, ch = canvas.height;
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, cw, ch);
    const pw = cw / cols, ph = ch / rows;   // scale 320x200 grid to the window
    for (let u = 0; u < cols; u++) {
      for (let v = 0; v < rows; v++) {
        const c = pixelGrid[u][v];
        if (c !== "#050510") {
          ctx.fillStyle = c;
          ctx.fillRect(u * pw, v * ph, pw + 1, ph + 1);
        }
      }
    }
  }

  function drive() {
    for (let u = 0; u < cols; u++) pixelGrid[u].fill("#050510");
    camera.z += 0.3;
    moveObj(car, {x: 0, y: 0, z: 0.3});
    makeTriangles();
    checkForCollision();
    draw();
  }

  

  function makeTriangles() {
    let offsetIndex = 0
    for(let obj of scene.objs) {
      let offset = scene.offset[offsetIndex]
      for(let triangle of obj.triangles) {
        let v0 = {x: triangle[0].x + offset.x, y: triangle[0].y + offset.y, z: triangle[0].z + offset.z}
        let v1 = {x: triangle[1].x + offset.x, y: triangle[1].y + offset.y, z: triangle[1].z + offset.z}
        let v2 = {x: triangle[2].x + offset.x, y: triangle[2].y + offset.y, z: triangle[2].z + offset.z}

        let cam0 = { x: v0.x - camera.x, y: v0.y - camera.y, z: v0.z - camera.z }
        let cam1 = { x: v1.x - camera.x, y: v1.y - camera.y, z: v1.z - camera.z }
        let cam2 = { x: v2.x - camera.x, y: v2.y - camera.y, z: v2.z - camera.z }

        let vert0_in_front = cam0.z > limit
        let vert1_in_front = cam1.z > limit
        let vert2_in_front = cam2.z > limit

        if(!vert0_in_front || !vert1_in_front || !vert2_in_front) continue;

        let p0 = {}
        p0.u = (cam0.x/cam0.z) * cols + cols / 2
        p0.v = (cam0.y/cam0.z) * rows + rows / 2

        let p1 = {}
        p1.u = (cam1.x/cam1.z) * cols + cols / 2
        p1.v = (cam1.y/cam1.z) * rows + rows / 2

        let p2 = {}
        p2.u = (cam2.x/cam2.z) * cols + cols / 2
        p2.v = (cam2.y/cam2.z) * rows + rows / 2
        
        fillTriangle(p0, p1, p2, "#FFFFFF")

      }
      offset++
    }
  }

  function moveObj(obj, offset) {
    // Loop through all triangles
    for (let triangle of obj.triangles) {
      for (let point of triangle) {
        point.x = point.x + offset.x
        point.y = point.y + offset.y
        point.z = point.z + offset.z
      }
    }
  }

  function fillTriangle(v0, v1, v2, color) {
    let area = areaOfTriangle(v0, v1, v2);
    console.log(area)
    if (area === 0) return;

    let minX = Math.max(0, Math.floor(Math.min(v0.u, v1.u, v2.u)));
    let maxX = Math.min(cols - 1, Math.ceil(Math.max(v0.u, v1.u, v2.u)));
    let minY = Math.max(0, Math.floor(Math.min(v0.v, v1.v, v2.v)));
    let maxY = Math.min(rows - 1, Math.ceil(Math.max(v0.v, v1.v, v2.v)));

    for (let y = minY; y <= maxY; y++) {
      for (let x = minX; x <= maxX; x++) {
        let P = { u: x + 0.5, v: y + 0.5 };

        let l0 = areaOfTriangle(P, v1, v2) / area;
        let l1 = areaOfTriangle(P, v2, v0) / area;
        let l2 = areaOfTriangle(P, v0, v1) / area;

        if (l0 >= 0 && l1 >= 0 && l2 >= 0) {
          setPixelColor(x, y, color);
        }
      }
    }
  }

  function areaOfTriangle(v0, v1, v2) {
    let a = {u: v1.u - v0.u, v: v1.v - v0.v}
    let b = {u: v2.u - v0.u, v: v2.v - v0.v}

    return a.u * b.v - a.v * b.u
  }

  function checkForCollision() {
    car_front_right_vertex = car.triangles[6][2]

    for(let other_car_front_right_vertex of other_cars_front_right_vertex) {
      let x_collision = betweenInts(car_front_right_vertex.x, other_car_front_right_vertex.x - 1 , other_car_front_right_vertex.x + 1)
      let z_collision = betweenInts(car_front_right_vertex.z, other_car_front_right_vertex.z - 5, other_car_front_right_vertex.z + 5)
      if (x_collision && z_collision) {
        crash()
      }
    }
  }

  function crash() {
    console.log("CRASH")
    reset()
  }

  function reset() {
    camera = {x: 0, y: 5, z: -10};
    car.vertices = [
        {"x": 0, "y": 0, "z": 0},
        {"x": 1, "y": 0, "z": 5},
        {"x": 0, "y": 0, "z": 5},
        {"x": 1, "y": 0, "z": 0},

        {"x": 0, "y": 1, "z": 0},
        {"x": 1, "y": 1, "z": 5},
        {"x": 0, "y": 1, "z": 5},
        {"x": 1, "y": 1, "z": 0},
    ]
  }

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    // draw();
  }

  function spawnOtherCars() {
    for(let i = 0; i < otherCarsCount; i++) {

      let car_clone = structuredClone(car)
      car_clone.color = "red"
      other_cars.push(car_clone)

      let randXPos = Math.floor(Math.random() * 3)

      other_cars_offset.push({x:-2.5 + (2 * randXPos),y:0,z:otherCarsOffset+(i*spaceBetweenOtherCars)})
      other_cars_front_right_vertex.push({x:-2.5 + (2 * randXPos) + 1.5,y:0,z:otherCarsOffset+(i*spaceBetweenOtherCars)+5})
    }
  }

  function createLaneLines() {
    for(let i = 0; i < 400; i++) {
      scene.objs.push(laneLine)
      scene.offset.push({x: 1, y: 0, z: i*3})
      scene.objs.push(laneLine)
      scene.offset.push({x: -1, y: 0, z: i*3})
    }
  }
  
  function createLamps() {
    for(let i = 0; i < 10; i++) {
      x_1 = Math.random()
      x_2 = Math.random()
      scene.objs.push(lamp)
      scene.offset.push({x: 4 + x_1, y: 0, z: i*100})
      scene.objs.push(lamp)
      scene.offset.push({x: -5 + x_2, y: 0, z: i*100})
    }
  }

  //this is how we detect events- 

  // do nothing for now....
    document.addEventListener("keydown", (event) => {

      event.preventDefault();
       switch (event.code) {
        case "ArrowLeft":
          //****TO DO: Change camera x position move left
          camera.x-=0.1;
          for(v of car.triangles) {
            v.x -= 0.1
          }
          console.log("Left arrow pressed");
          break;
        case "ArrowRight":
          //****TO DO: Change camera x position move right
          camera.x+=0.1;
          for(v of car.vertices) {
            v.x += 0.1
          }
          console.log("Right arrow pressed");
          break;
        case "KeyR":
          reset()
          break;
        default:
          return; 
      
      }
    });

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();



</script>
</body>
</html>
