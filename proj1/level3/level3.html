<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Rendering Algo</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #050510;
      color: white;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="info">
    <b>Projection</b><br>
  </div>

<script>
  //
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const rows = 200;
  const cols = 320;
  const pixelGrid = Array.from({ length: cols }, () => Array(rows).fill("#050510"));

  let seePixelOutline = false; 

  const limit = 1
  const spaceBetweenOtherCars = 25
  const otherCarsOffset = 40
  const otherCarsCount = 100

  let camera = {x: 0, y: 5, z: -10}

  //Objects

  //I lowkey used AI for these objects..plz dont be mad...
  const car = {
    "triangles": [
      // x = 0 face (left)
      [{"x": 0, "y": 0, "z": 0}, {"x": 0, "y": 0, "z": 5}, {"x": 0, "y": 1, "z": 5}],
      [{"x": 0, "y": 0, "z": 0}, {"x": 0, "y": 1, "z": 5}, {"x": 0, "y": 1, "z": 0}],

      // x = 1 face (right)
      [{"x": 1, "y": 0, "z": 0}, {"x": 1, "y": 1, "z": 0}, {"x": 1, "y": 1, "z": 5}],
      [{"x": 1, "y": 0, "z": 0}, {"x": 1, "y": 1, "z": 5}, {"x": 1, "y": 0, "z": 5}],

      // y = 1 face (top)
      [{"x": 0, "y": 1, "z": 0}, {"x": 0, "y": 1, "z": 5}, {"x": 1, "y": 1, "z": 0}],
      [{"x": 0, "y": 1, "z": 5}, {"x": 1, "y": 1, "z": 5}, {"x": 1, "y": 1, "z": 0}],

      // y = 0 face (bottom)
      [{"x": 0, "y": 0, "z": 0}, {"x": 1, "y": 0, "z": 0}, {"x": 1, "y": 0, "z": 5}],
      [{"x": 0, "y": 0, "z": 0}, {"x": 1, "y": 0, "z": 5}, {"x": 0, "y": 0, "z": 5}],

      // z = 0 face (back)
      [{"x": 0, "y": 0, "z": 0}, {"x": 0, "y": 1, "z": 0}, {"x": 1, "y": 1, "z": 0}],
      [{"x": 0, "y": 0, "z": 0}, {"x": 1, "y": 1, "z": 0}, {"x": 1, "y": 0, "z": 0}],

      // z = 5 face (front)
      [{"x": 0, "y": 0, "z": 5}, {"x": 1, "y": 0, "z": 5}, {"x": 1, "y": 1, "z": 5}],
      [{"x": 0, "y": 0, "z": 5}, {"x": 1, "y": 1, "z": 5}, {"x": 0, "y": 1, "z": 5}]
    ],
    "color": "blue",
    "scale": 10
  }

  const plane = {
    "triangles": [
      [{"x": -500, "y": 0, "z": 0},    {"x": -500, "y": 0, "z": 2000}, {"x": 500, "y": 0, "z": 0}],
      [{"x": -500, "y": 0, "z": 2000}, {"x": 500, "y": 0, "z": 2000},  {"x": 500, "y": 0, "z": 0}]
    ],
    "color": "gray",
    "scale": 1
  }

  const laneLine = {
    "triangles": [
      [{"x": 0, "y": 0, "z": 0}, {"x": 0.125, "y": 0, "z": 0}, {"x": 0, "y": 0, "z": 2}],
      [{"x": 0.125, "y": 0, "z": 0}, {"x": 0.125, "y": 0, "z": 2}, {"x": 0, "y": 0, "z": 2}]
    ],
    "color": "white",
    "scale": 1
  }

  const endLaneLine = {
    "triangles": [
      [{"x": 0, "y": 0, "z": 0}, {"x": 0.25, "y": 0, "z": 0}, {"x": 0.25, "y": 0, "z": 2000}],
      [{"x": 0, "y": 0, "z": 0}, {"x": 0, "y": 0, "z": 2000}, {"x": 0.25, "y": 0, "z": 2000}]
    ],
    "color": "yellow",
    "scale": 1
  }

  const lamp = {
  "triangles": [
    // x = 0 face (left)
    [{"x": 0, "y": 0, "z": 0}, {"x": 0, "y": 0, "z": 2}, {"x": 0, "y": 4, "z": 2}],
    [{"x": 0, "y": 0, "z": 0}, {"x": 0, "y": 4, "z": 2}, {"x": 0, "y": 4, "z": 0}],

    // x = 1 face (right)
    [{"x": 1, "y": 0, "z": 0}, {"x": 1, "y": 4, "z": 0}, {"x": 1, "y": 4, "z": 2}],
    [{"x": 1, "y": 0, "z": 0}, {"x": 1, "y": 4, "z": 2}, {"x": 1, "y": 0, "z": 2}],

    // y = 4 face (top)
    [{"x": 0, "y": 4, "z": 0}, {"x": 0, "y": 4, "z": 2}, {"x": 1, "y": 4, "z": 0}],
    [{"x": 0, "y": 4, "z": 2}, {"x": 1, "y": 4, "z": 2}, {"x": 1, "y": 4, "z": 0}],

    // y = 0 face (bottom)
    [{"x": 0, "y": 0, "z": 0}, {"x": 1, "y": 0, "z": 0}, {"x": 1, "y": 0, "z": 2}],
    [{"x": 0, "y": 0, "z": 0}, {"x": 1, "y": 0, "z": 2}, {"x": 0, "y": 0, "z": 2}],

    // z = 0 face (back)
    [{"x": 0, "y": 0, "z": 0}, {"x": 0, "y": 4, "z": 0}, {"x": 1, "y": 4, "z": 0}],
    [{"x": 0, "y": 0, "z": 0}, {"x": 1, "y": 4, "z": 0}, {"x": 1, "y": 0, "z": 0}],

    // z = 2 face (front)
    [{"x": 0, "y": 0, "z": 2}, {"x": 1, "y": 0, "z": 2}, {"x": 1, "y": 4, "z": 2}],
    [{"x": 0, "y": 0, "z": 2}, {"x": 1, "y": 4, "z": 2}, {"x": 0, "y": 4, "z": 2}]
  ],
  "color": "white",
  "scale": 1
}

  let scene = {
    objs: [plane],
    offset: [{x:0,y:0,z:0}]
  }

  let other_cars = []
  let other_cars_offset = []
  let other_cars_front_right_vertex = []

  createLaneLines()
  createLamps()
  spawnOtherCars()

  scene.objs.push(...other_cars)
  scene.offset.push(...other_cars_offset)

  scene.objs.push(car)
  scene.offset.push({x:-.5,y:0,z:.5})

  //ALL FUNCTIONS BELOW

  function betweenInts(x, lower, upper){
    return (x >= lower && x <= upper)
  }

  function setPixelColor(u,v,color){
    if (u < 0 || u >= cols || v < 0 || v >= rows) return;
    pixelGrid[u][v] = color
  }

  function loop() {
    drive();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function draw(){

    //here we set up and clear the canvas, every draw frame
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.lineWidth = 1;
    ctx.strokeStyle = "#444444";

    for(let v=0; v< 200; v++){
      for(let u=0; u<320; u++){
        ctx.fillStyle = pixelGrid[u][v];
        ctx.fillRect(u*5, v*5, 5, 5);

        if( seePixelOutline ){
          ctx.strokeRect(u*5, v*5, 5, 5);
        }

      }
    }
  }

  function drive() {
    for (let u = 0; u < cols; u++) pixelGrid[u].fill("#050510");
    camera.z += 0.3;
    moveObj(car, {x: 0, y: 0, z: 0.3});

    let offsetIndex = 0
    for(let obj of scene.objs) {
      let offset = scene.offset[offsetIndex]
      for(let triangle of obj.triangles) {
        
        let vert0 = {x: triangle[0].x + offset.x - camera.x, y: triangle[0].y + offset.y - camera.y, z: triangle[0].z + offset.z - camera.z}
        let vert1 = {x: triangle[1].x + offset.x - camera.x, y: triangle[1].y + offset.y - camera.y, z: triangle[1].z + offset.z - camera.z}
        let vert2 = {x: triangle[2].x + offset.x - camera.x, y: triangle[2].y + offset.y - camera.y, z: triangle[2].z + offset.z - camera.z}

        makeTriangles(vert0, vert1, vert2, obj.color)
      }
      offsetIndex++
    }

    checkForCollision();
    draw();
  }

  // Expects these to be in cam space and returns in cam space
  function planeIntersect(front, back) {
      let new_back_vert = {}
      // t is a fraction of how much of the line is visable
      let t = (front.z - limit) / (front.z - back.z)

      new_back_vert.x = front.x + t * (back.x - front.x)
      new_back_vert.y = front.y + t * (back.y - front.y)
      new_back_vert.z = limit
      return new_back_vert;
  }

  // Expects these to be in cam space
  function makeTriangles(v0, v1, v2, color) {

    let vert0_in_front = v0.z >= limit
    let vert1_in_front = v1.z >= limit
    let vert2_in_front = v2.z >= limit

    //if(!vert0_in_front || !vert1_in_front || !vert2_in_front) continue;

    if(!vert0_in_front && !vert1_in_front && !vert2_in_front){
      return;
    }
    else if(vert0_in_front && !vert1_in_front && !vert2_in_front) {
      let new_vert1 = planeIntersect(v0, v1)
      let new_vert2 = planeIntersect(v0, v2)
      makeTriangles(v0, new_vert1, new_vert2, color)
      return;
    }
    else if (!vert0_in_front && vert1_in_front && !vert2_in_front) {
      let new_vert1 = planeIntersect(v1, v0)
      let new_vert2 = planeIntersect(v1, v2)
      makeTriangles(v1, new_vert1, new_vert2, color)
      return;
    }
    else if (vert0_in_front && vert1_in_front && !vert2_in_front) {
      let v02_intersect = planeIntersect(v0, v2)
      let v12_intersect = planeIntersect(v1, v2)

      makeTriangles(v0, v1, v02_intersect, color)
      makeTriangles(v1, v02_intersect, v12_intersect, color)
      return;
    }
    else if (!vert0_in_front && !vert1_in_front && vert2_in_front) {
      let new_vert1 = planeIntersect(v2, v0)
      let new_vert2 = planeIntersect(v2, v1)
      makeTriangles(v2, new_vert1, new_vert2, color)
      return;
    }
    else if (vert0_in_front && !vert1_in_front && vert2_in_front) {
      let v12_intersect = planeIntersect(v2, v1)
      let v01_intersect = planeIntersect(v0, v1)

      makeTriangles(v2, v12_intersect, v0, color)
      makeTriangles(v0, v01_intersect, v12_intersect, color)
      return;
    }
    else if (!vert0_in_front && vert1_in_front && vert2_in_front) {
      let v02_intersect = planeIntersect(v2, v0)
      let v01_intersect = planeIntersect(v1, v0)

      makeTriangles(v2, v02_intersect, v1, color)
      makeTriangles(v1, v01_intersect, v02_intersect, color)
      return;
    }

    let p0 = {}
    p0.x = (v0.x/v0.z) * cols + cols / 2
    p0.y = rows / 2 - (v0.y/v0.z) * rows

    let p1 = {}
    p1.x = (v1.x/v1.z) * cols + cols / 2
    p1.y = rows / 2 - (v1.y/v1.z) * rows

    let p2 = {}
    p2.x = (v2.x/v2.z) * cols + cols / 2
    p2.y = rows / 2 - (v2.y/v2.z) * rows
    
    fillTriangle(p0, p1, p2, color)
  }

  function moveObj(obj, offset) {
    // Loop through all triangles
    for (let triangle of obj.triangles) {
      for (let point of triangle) {
        point.x = point.x + offset.x
        point.y = point.y + offset.y
        point.z = point.z + offset.z
      }
    }
  }

  function fillTriangle(v1, v2, v3, color) {
    let maxX = Math.min(cols - 1, Math.ceil(Math.max(v1.x, v2.x, v3.x)))
    let minX = Math.max(0, Math.floor(Math.min(v1.x, v2.x, v3.x)))

    let maxY = Math.min(rows - 1, Math.ceil(Math.max(v1.y, v2.y, v3.y)))
    let minY = Math.max(0, Math.floor(Math.min(v1.y, v2.y, v3.y)))

    for(let x = minX; x <= maxX; x++) {
      for(let y = minY; y <= maxY; y++) {
        let a1 = subtract2dVector(v1, v2)
        let a2 = subtract2dVector({x: x, y: y}, v2)
        let a3 = subtract2dVector(v3, v2)

        let x1 = a1.x
        let y1 = a1.y

        let x2 = a2.x
        let y2 = a2.y

        let x3 = a3.x
        let y3 = a3.y

        let l3 = (x1*y2 - x2*y1) / (x1*y3 - x3*y1)
        let l1 = (x2*y3 - x3*y2) / (x1*y3 - x3*y1)
        let l2 = 1 - (l1+l3)

        if (betweenInts(l1, 0 , 1) && betweenInts(l2, 0, 1) && betweenInts(l3, 0, 1)){
          setPixelColor(x, y, color)
        }
      }
    }
  }

  function subtract2dVector(v1, v2) {
    return {x: v1.x - v2.x, y: v1.y - v2.y}
  }


  function checkForCollision() {
    let car_front_right_vertex = car.triangles[6][2]

    for(let other_car_front_right_vertex of other_cars_front_right_vertex) {
      let x_collision = betweenInts(car_front_right_vertex.x, other_car_front_right_vertex.x - 1 , other_car_front_right_vertex.x + 1)
      let z_collision = betweenInts(car_front_right_vertex.z, other_car_front_right_vertex.z - 5, other_car_front_right_vertex.z + 5)
      if (x_collision && z_collision) {
        reset()
      }
    }
  }

  function reset() {
    camera = {x: 0, y: 5, z: -10};
    car.triangles = [
      [{"x": 0, "y": 0, "z": 0}, {"x": 0, "y": 0, "z": 5}, {"x": 0, "y": 1, "z": 5}],
      [{"x": 0, "y": 0, "z": 0}, {"x": 0, "y": 1, "z": 5}, {"x": 0, "y": 1, "z": 0}],

      [{"x": 1, "y": 0, "z": 0}, {"x": 1, "y": 1, "z": 0}, {"x": 1, "y": 1, "z": 5}],
      [{"x": 1, "y": 0, "z": 0}, {"x": 1, "y": 1, "z": 5}, {"x": 1, "y": 0, "z": 5}],

      [{"x": 0, "y": 1, "z": 0}, {"x": 0, "y": 1, "z": 5}, {"x": 1, "y": 1, "z": 0}],
      [{"x": 0, "y": 1, "z": 5}, {"x": 1, "y": 1, "z": 5}, {"x": 1, "y": 1, "z": 0}],

      [{"x": 0, "y": 0, "z": 0}, {"x": 1, "y": 0, "z": 0}, {"x": 1, "y": 0, "z": 5}],
      [{"x": 0, "y": 0, "z": 0}, {"x": 1, "y": 0, "z": 5}, {"x": 0, "y": 0, "z": 5}],

      [{"x": 0, "y": 0, "z": 0}, {"x": 0, "y": 1, "z": 0}, {"x": 1, "y": 1, "z": 0}],
      [{"x": 0, "y": 0, "z": 0}, {"x": 1, "y": 1, "z": 0}, {"x": 1, "y": 0, "z": 0}],

      [{"x": 0, "y": 0, "z": 5}, {"x": 1, "y": 0, "z": 5}, {"x": 1, "y": 1, "z": 5}],
      [{"x": 0, "y": 0, "z": 5}, {"x": 1, "y": 1, "z": 5}, {"x": 0, "y": 1, "z": 5}]
    ]
  }

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    // draw();
  }

  function spawnOtherCars() {
    for(let i = 0; i < otherCarsCount; i++) {

      let car_clone = structuredClone(car)
      car_clone.color = "red"
      other_cars.push(car_clone)

      let randXPos = Math.floor(Math.random() * 3)

      other_cars_offset.push({x:-2.5 + (2 * randXPos),y:0,z:otherCarsOffset+(i*spaceBetweenOtherCars)})
      other_cars_front_right_vertex.push({x:-2.5 + (2 * randXPos) + 1.5,y:0,z:otherCarsOffset+(i*spaceBetweenOtherCars)+5})
    }
  }

  function createLaneLines() {
    for(let i = 0; i < 400; i++) {
      scene.objs.push(laneLine)
      scene.offset.push({x: 1, y: 0, z: i*3})
      scene.objs.push(laneLine)
      scene.offset.push({x: -1.0, y: 0, z: i*3})
    }
    scene.objs.push(endLaneLine)
    scene.offset.push({x: -3.625, y: 0, z: 0})
    scene.objs.push(endLaneLine)
    scene.offset.push({x: 3.375, y: 0, z: 0})
  }
  
  function createLamps() {
    for(let i = 0; i < 10; i++) {
      let x_1 = Math.random()
      let x_2 = Math.random()
      scene.objs.push(lamp)
      scene.offset.push({x: 4 + x_1, y: 0, z: i*100})
      scene.objs.push(lamp)
      scene.offset.push({x: -5 + x_2, y: 0, z: i*100})
    }
  }

  //this is how we detect events- 

  // do nothing for now....
    document.addEventListener("keydown", (event) => {

      event.preventDefault();
       switch (event.code) {
        case "ArrowLeft":
          //****TO DO: Change camera x position move left
          camera.x-=0.1;
          for(let triangle of car.triangles) {
            for(let vert of triangle) {
              vert.x -= 0.1
            }
          }
          console.log("Left arrow pressed");
          break;
        case "ArrowRight":
          //****TO DO: Change camera x position move right
          camera.x+=0.1;
          for(let triangle of car.triangles) {
            for(let vert of triangle) {
              vert.x += 0.1
            }
          }
          console.log("Right arrow pressed");
          break;
        case "KeyR":
          reset()
          break;
        default:
          return; 
      
      }
    });

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();



</script>
</body>
</html>
